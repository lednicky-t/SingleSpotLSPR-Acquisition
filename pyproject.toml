[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lspr-acquisition"
description = "Desktop LSPR acquisition and experiment-control application."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
# Version bounds follow the pinning policy in CLAUDE.md ("Dependency Pinning"):
# floor = currently tested version, ceiling = next breaking-change boundary.
# pyqtgraph is pre-1.0 (API can break on any minor release), hence the tight
# "<0.15" ceiling instead of "<1".
dependencies = [
    "h5py>=3.16,<4",
    "matplotlib>=3.11,<4",
    "numpy>=2.4,<3",
    "PyQt6>=6.11,<7",
    # See apps/LSPRi/eva/pyproject.toml for why - PyQt6-sip 13.11.1 has a
    # reproducible access-violation crash on Python 3.14, fixed in 13.12.0.
    "PyQt6-sip>=13.12.0",
    "pyqtgraph>=0.14,<0.15",
    "pyserial>=3.5,<4",
    "PyYAML>=6.0,<7",
    "scipy>=1.17,<2",
    "seabreeze>=2.11,<3",
    "platformdirs>=4.10,<5",
    "lspr-ui>=0.1.0",
    "lspr-core>=0.1.0",
    "lspr-io>=0.1.0",
]

[project.scripts]
lspr-acquisition = "lspr_app.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "lspr_app.__version__"}

[tool.setuptools.package-data]
"lspr_app.resources" = ["icons/*.svg"]
